# Name of your workflow
name: Build and Deploy to GitHub Pages

# Run this workflow on every push to the main branch
on:
  push:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the current run and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

# Define the jobs to run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your repository's code
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 2. Set up Node.js for building the React app
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies and build the project
      - name: Install and Build 🛠️
        run: |
          npm install
          npm run build

      # 4. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
